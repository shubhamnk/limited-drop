spring:
  datasource:
    url: jdbc:mysql://mysql:3306/drop_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:drop_user}
    password: ${MYSQL_PASSWORD:drop_pass}
  data:
    redis:
      host: redis
      port: 6379
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
